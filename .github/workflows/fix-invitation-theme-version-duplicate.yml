name: Fix invitation theme version duplicate

on:
  push:
    branches:
      - feat/theme-token-migration

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/theme-token-migration
          fetch-depth: 0

      - name: Remove duplicate theme_version_id
        shell: python
        run: |
          from pathlib import Path
          for raw in ['app/dashboard/undangan/baru/page.tsx', 'app/dashboard/undangan/[id]/edit/page.tsx']:
              path = Path(raw)
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  '          theme_version_id: themeVersionId,\n          theme_version_id: themeVersionId,',
                  '          theme_version_id: themeVersionId,'
              )
              path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-invitation-theme-version-duplicate.yml').unlink()

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'app/dashboard/undangan/baru/page.tsx' 'app/dashboard/undangan/[id]/edit/page.tsx' '.github/workflows/fix-invitation-theme-version-duplicate.yml'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(themes): remove duplicate invitation theme version key [skip ci]"
          git push origin HEAD:feat/theme-token-migration
