name: Migrate theme tokens and harden storage paths

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip token-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run codemod
        run: node scripts/migrate-theme-tokens.mjs

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/themes app/dashboard/undangan/baru/page.tsx 'app/dashboard/undangan/[id]/edit/page.tsx'
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: migrate theme renderers to runtime tokens [skip token-migration]"
          git push origin main
