name: Migrate first theme renderers to tokens

on:
  push:
    branches:
      - feat/theme-token-migration

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'migrate first theme renderers') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate Minimalist, Golden Arch and Royal Gold
        shell: python
        run: |
          from pathlib import Path

          # Minimalist: only the stable base background is tokenized.
          path = Path('components/themes/MinimalistTheme.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('bg-[#0d0914]', 'bg-[var(--theme-background)]')
          path.write_text(text, encoding='utf-8')

          # Golden Arch: migrate its established semantic palette.
          path = Path('components/themes/GoldenArchTheme.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'bg-[#F5F4F0]': 'bg-[var(--theme-background)]',
              'text-[#F5F4F0]': 'text-[var(--theme-background)]',
              'border-[#F5F4F0]': 'border-[var(--theme-background)]',
              'bg-[#1E1E1E]': 'bg-[var(--theme-text)]',
              'text-[#1E1E1E]': 'text-[var(--theme-text)]',
              'border-[#1E1E1E]': 'border-[var(--theme-text)]',
              'hover:bg-[#1E1E1E]': 'hover:bg-[var(--theme-text)]',
              'hover:text-[#1E1E1E]': 'hover:text-[var(--theme-text)]',
              'bg-[#D4AF37]': 'bg-[var(--theme-primary)]',
              'text-[#D4AF37]': 'text-[var(--theme-primary)]',
              'border-[#D4AF37]': 'border-[var(--theme-primary)]',
              'bg-[#D4AF37]/10': 'bg-[rgba(var(--theme-primary-rgb),0.1)]',
              'border-[#D4AF37]/30': 'border-[rgba(var(--theme-primary-rgb),0.3)]',
              'border-[#D4AF37]/50': 'border-[rgba(var(--theme-primary-rgb),0.5)]',
              'border-[#E0DED5]': 'border-[var(--theme-secondary)]',
              'border-[#E0DED5]/50': 'border-[rgba(var(--theme-secondary-rgb),0.5)]',
              'text-[#1E1E1E]/60': 'text-[rgba(var(--theme-text-rgb),0.6)]',
              'text-[#1E1E1E]/80': 'text-[rgba(var(--theme-text-rgb),0.8)]',
              'bg-[#F5F4F0]/50': 'bg-[rgba(var(--theme-background-rgb),0.5)]',
              'rgba(212,175,55,0.3)': 'rgba(var(--theme-primary-rgb),0.3)',
              'rgba(212,175,55,0.1)': 'rgba(var(--theme-primary-rgb),0.1)',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          # Royal Gold already uses themeColors inline. Its only hard-coded
          # section surface becomes a dedicated token.
          path = Path('components/themes/RoyalGoldTheme.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('bg-[#0B101D]', 'bg-[var(--theme-surface)]')
          path.write_text(text, encoding='utf-8')

      - name: Verify renderer migrations
        run: |
          ! grep -n 'bg-\[#0d0914\]' components/themes/MinimalistTheme.tsx
          ! grep -n '#D4AF37\|#F5F4F0\|#1E1E1E\|#E0DED5' components/themes/GoldenArchTheme.tsx
          ! grep -n 'bg-\[#0B101D\]' components/themes/RoyalGoldTheme.tsx
          grep -n 'var(--theme-' components/themes/MinimalistTheme.tsx | head
          grep -n 'var(--theme-' components/themes/GoldenArchTheme.tsx | head
          grep -n 'var(--theme-' components/themes/RoyalGoldTheme.tsx | head

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/themes/MinimalistTheme.tsx components/themes/GoldenArchTheme.tsx components/themes/RoyalGoldTheme.tsx .github/workflows/migrate-first-theme-renderers.yml
          git commit -m 'feat: migrate first theme renderers to tokens'
          git rm .github/workflows/migrate-first-theme-renderers.yml
          git commit -m 'chore: remove one-shot theme renderer workflow'
          git push
