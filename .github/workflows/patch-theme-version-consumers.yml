name: Patch theme version consumers

on:
  push:
    branches:
      - fix/theme-rls-grants

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'align theme version consumers') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch consumers
        shell: python
        run: |
          from pathlib import Path

          public = Path('app/[username]/page.tsx')
          text = public.read_text(encoding='utf-8')
          old = '''  const isFreePlan = profile?.plan !== "premium" && profile?.plan !== "pro";\n  const resolvedTheme = resolveThemeConfig(invitation.themes);'''
          new = '''  const isFreePlan = profile?.plan !== "premium" && profile?.plan !== "pro";\n  const { data: themeVersion } = invitation.theme_version_id\n    ? await supabase.from("theme_versions").select("*").eq("id", invitation.theme_version_id).maybeSingle()\n    : { data: null };\n  const resolvedTheme = resolveThemeConfig(invitation.themes, themeVersion);'''
          if old not in text:
              raise SystemExit('public consumer pattern not found')
          public.write_text(text.replace(old, new, 1), encoding='utf-8')

          for rel in ['app/demo/[id]/page.tsx', 'app/admin/themes/preview/[slug]/page.tsx']:
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              if 'const resolvedTheme = resolveThemeConfig(theme);' not in text:
                  raise SystemExit(f'consumer pattern not found: {rel}')
              marker = '  const resolvedTheme = resolveThemeConfig(theme);'
              replacement = '''  const { data: themeVersion } = await supabase\n    .from("theme_versions")\n    .select("*")\n    .eq("theme_id", theme.id)\n    .eq("is_published", true)\n    .order("version", { ascending: false })\n    .limit(1)\n    .maybeSingle();\n\n  const resolvedTheme = resolveThemeConfig(theme, themeVersion);'''
              path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

      - name: Verify
        run: |
          grep -R 'resolveThemeConfig(invitation.themes, themeVersion)' 'app/[username]/page.tsx'
          grep -R 'resolveThemeConfig(theme, themeVersion)' 'app/demo/[id]/page.tsx' 'app/admin/themes/preview/[slug]/page.tsx'

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/[username]/page.tsx' 'app/demo/[id]/page.tsx' 'app/admin/themes/preview/[slug]/page.tsx' .github/workflows/patch-theme-version-consumers.yml
          git commit -m 'fix: align theme version consumers'
          git rm .github/workflows/patch-theme-version-consumers.yml
          git commit -m 'chore: remove one-shot theme patch workflow'
          git push
