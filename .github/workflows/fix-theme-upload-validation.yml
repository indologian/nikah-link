name: Apply theme upload validation fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: prevent theme image validation race') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch theme editor upload validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/dashboard/undangan/[id]/edit/page.tsx')
          s = p.read_text()

          old = '''  const handleNext = () => {
    if (isResolvingTheme) {
      return;
    }
'''
          new = '''  const handleNext = async () => {
    if (isResolvingTheme) {
      return;
    }

    // Do not validate theme custom fields while an image upload is still active.
    // React state can lag one render when the user taps Lanjut immediately after
    // choosing a file, so the upload must finish before validating its URL.
    if (Object.values(uploading).some(Boolean)) {
      setError("Foto masih sedang diunggah. Silakan tunggu sampai selesai.");
      return;
    }
'''
          if old not in s:
              raise SystemExit('handleNext target not found')
          s = s.replace(old, new, 1)

          old = '''              disabled={isResolvingTheme}
              className="flex items-center gap-2 bg-slate-900'''
          new = '''              disabled={isResolvingTheme || Object.values(uploading).some(Boolean)}
              className="flex items-center gap-2 bg-slate-900'''
          if old not in s:
              raise SystemExit('next button target not found')
          s = s.replace(old, new, 1)

          old = '''              {isResolvingTheme ? (
                <>
                  <Loader2 className="w-4 h-4 animate-spin" />
                  Memuat tema...
                </>
              ) : (
'''
          new = '''              {isResolvingTheme ? (
                <>
                  <Loader2 className="w-4 h-4 animate-spin" />
                  Memuat tema...
                </>
              ) : Object.values(uploading).some(Boolean) ? (
                <>
                  <Loader2 className="w-4 h-4 animate-spin" />
                  Mengunggah foto...
                </>
              ) : (
'''
          if old not in s:
              raise SystemExit('next button label target not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-theme-upload-validation.yml
          git add app/dashboard/undangan/[id]/edit/page.tsx .github/workflows/fix-theme-upload-validation.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: prevent theme image validation race"
          git push
