name: one-time-refactor

on:
  push:
    branches:
      - refactor/architecture-v1
    paths:
      - "scripts/.hardening-refactor.mjs"
      - "app/dashboard/undangan/baru/page.tsx"
      - "app/dashboard/undangan/[id]/edit/page.tsx"

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message != 'refactor: route invitation editors through server actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/architecture-v1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/.hardening-refactor.mjs

      - name: Remove one-time codemod
        run: |
          rm -f scripts/.hardening-refactor.mjs .github/workflows/.hardening-refactor.yml
          git add -A
          git commit -m "chore: remove one-time hardening codemod" || true
          git push origin HEAD:refactor/architecture-v1
